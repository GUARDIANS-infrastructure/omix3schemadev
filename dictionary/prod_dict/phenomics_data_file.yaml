$schema: http://json-schema.org/draft-04/schema#
id: phenomics_data_file
title: phenomics_data_file
type: object
namespace: https://omix3.test.biocommons.org.au/
category: data_file
program: '*'
project: '*'
description: 'Data file containing the results of a measurement/assessment performed
  on a participant at baseline.

  '
submittable: true
validators: null
systemProperties:
- id
- project_id
- state
- created_datetime
- updated_datetime
uniqueKeys:
- - id
- - project_id
  - submitter_id
required:
- submitter_id
- type
links:
- exclusive: false
  required: true
  subgroup:
  - name: sites
    backref: phenomics_data_files
    label: part_of
    target_type: site
    multiplicity: many_to_one
    required: false
  - name: core_metadata_collections
    backref: phenomics_data_files
    label: part_of
    target_type: core_metadata_collection
    multiplicity: one_to_one
    required: false
properties:
  $ref: _definitions.yaml#/data_file_properties
  data_format:
    description: The format of the data in this data file
    enum:
    - csv
    - tsv
    - jpeg
    - png
    - pdf
  data_category:
    description: Broad categorization of the contents of the data file.
    enum:
    - summarised results
    - quality control
    - raw data
    - processed data
    - dxa report
    - spirometry report
    - ecg report
    - other
  data_type:
    description: The data type
    enum:
    - csv
    - tsv
    - jpeg
    - png
    - pdf
  measurement_name:
    description: Name of the measurement/assessment performed that this data file
      contains results for
    enum:
    - Electrocardiogram
    - Spirometry
    - DXA
  sites:
    $ref: _definitions.yaml#/to_one
  core_metadata_collections:
    $ref: _definitions.yaml#/to_one
additionalProperties: false
