$schema: http://json-schema.org/draft-04/schema#
id: lipidomics_file
title: lipidomics_file
type: object
namespace: https://omix3.test.biocommons.org.au/
category: data_file
program: '*'
project: '*'
description: 'Data file containing lipidomics data

  '
submittable: true
validators: null
systemProperties:
- id
- project_id
- state
- created_datetime
- updated_datetime
uniqueKeys:
- - id
- - project_id
  - submitter_id
required:
- submitter_id
- type
links:
- exclusive: false
  required: true
  subgroup:
  - name: sites
    backref: lipidomics_files
    label: part_of
    target_type: site
    multiplicity: many_to_one
    required: true
  - name: lipidomics_assays
    backref: lipidomics_files
    label: part_of
    target_type: lipidomics_assay
    multiplicity: many_to_one
    required: true
  - name: core_metadata_collections
    backref: lipidomics_files
    label: part_of
    target_type: core_metadata_collection
    multiplicity: one_to_one
    required: false
properties:
  $ref: _definitions.yaml#/data_file_properties
  data_format:
    description: The format of the data in this data file
    enum:
    - csv
    - tsv
    - xls
    - xlsx
  data_category:
    description: Broad categorization of the contents of the data file.
    enum:
    - mass spec raw
    - mass spec processed
    - summarised results
    - quality control
  data_type:
    description: The data type
    enum:
    - csv
    - tsv
    - xls
    - xlsx
  cv:
    type: number
    description: Coefficient of variation (%)
  facility_run_id:
    type: string
    description: A unique identifier of which run the file was generated from
  facility_batch_id:
    type: string
    description: A unique identifier of which batch of samples the file was generated
      from
  facility_run_date:
    type: string
    description: The date the batch was analysed (YYYY-MM-DD)
  data_processing_app:
    description: Application/software used to pre-process the data
    enum:
    - Skyline
    - Other
  sites:
    $ref: _definitions.yaml#/to_one
  lipidomics_assays:
    $ref: _definitions.yaml#/to_one
  core_metadata_collections:
    $ref: _definitions.yaml#/to_one
additionalProperties: false
