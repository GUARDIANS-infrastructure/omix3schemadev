$schema: http://json-schema.org/draft-04/schema#
id: alignment_workflow
title: alignment_workflow
type: object
namespace: https://omix3.test.biocommons.org.au/
category: analysis
program: '*'
project: '*'
description: 'Metadata for the alignment pipeline used to align reads during genomic
  analysis. This includes the software and version used, as well as the parameters
  used for alignment.

  '
submittable: true
validators: null
systemProperties:
- id
- project_id
- state
- created_datetime
- updated_datetime
uniqueKeys:
- - id
- - project_id
  - submitter_id
required:
- submitter_id
- type
links:
- name: unaligned_reads_files
  backref: alignment_workflows
  label: part_of
  target_type: unaligned_reads_file
  multiplicity: one_to_many
  required: true
properties:
  $ref: _definitions.yaml#/ubiquitous_properties
  software_name:
    type: string
    description: Name of the software used for alignment
  software_version:
    type: string
    description: Version of the software used for alignment
  unaligned_reads_files:
    $ref: _definitions.yaml#/to_many
additionalProperties: false
