$schema: http://json-schema.org/draft-04/schema#
id: genomics_assay
title: genomics_assay
type: object
namespace: https://omix3.test.biocommons.org.au/
category: experimental_methods
program: '*'
project: '*'
description: 'Details about the methods that produced the genomics data

  '
submittable: true
validators: null
systemProperties:
- id
- project_id
- state
- created_datetime
- updated_datetime
uniqueKeys:
- - id
- - project_id
  - submitter_id
required:
- submitter_id
- type
links:
- exclusive: false
  required: true
  subgroup:
  - name: sites
    backref: genomics_assays
    label: part_of
    target_type: site
    multiplicity: many_to_one
    required: true
  - name: samples
    backref: genomics_assays
    label: part_of
    target_type: sample
    multiplicity: one_to_many
    required: true
properties:
  $ref: _definitions.yaml#/ubiquitous_properties
  sites:
    $ref: _definitions.yaml#/to_one
  samples:
    $ref: _definitions.yaml#/to_many
additionalProperties: false
