$schema: http://json-schema.org/draft-04/schema#
id: wearable_measurements
title: wearable_measurements
type: object
namespace: https://omix3.test.biocommons.org.au/
category: clinical
program: '*'
project: '*'
description: 'Wearable measurements obtained from a Fitbit device taken for the participant
  at baseline.

  '
submittable: true
validators: null
systemProperties:
- id
- project_id
- state
- created_datetime
- updated_datetime
uniqueKeys:
- - id
- - project_id
  - submitter_id
required:
- submitter_id
- type
links:
- name: sites
  backref: wearable_measurementss
  label: part_of
  target_type: site
  multiplicity: one_to_one
  required: false
properties:
  $ref: _definitions.yaml#/ubiquitous_properties
  avg_heart_rate:
    type: number
    description: Average heart rate of the participant in beats per minute
  avg_step_count:
    type: number
    description: Average daily step count of the participant
  sites:
    $ref: _definitions.yaml#/to_one
additionalProperties: false
