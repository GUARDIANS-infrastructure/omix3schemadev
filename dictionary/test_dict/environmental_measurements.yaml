$schema: http://json-schema.org/draft-04/schema#
id: environmental_measurements
title: environmental_measurements
type: object
namespace: https://data.acdc.ozheart.org/
category: clinical
program: '*'
project: '*'
description: 'Environmental exposure measurements taken for the participant at baseline.

  '
submittable: true
validators: null
systemProperties:
- id
- project_id
- state
- created_datetime
- updated_datetime
uniqueKeys:
- - id
- - project_id
  - submitter_id
required:
- submitter_id
- type
links: []
properties:
  $ref: _definitions.yaml#/ubiquitous_properties
  greenspace_proximity:
    description: Walking time from home to the nearest green or natural space.
    enum:
    - Fewer than 5 minutes
    - 5-9 minutes
    - 10-19 minutes
    - 20-30 minutes
    - More than 30 minutes
    - No green space/too far to walk
  household_size:
    type: integer
    description: Total number of people living in the household including the participant.
additionalProperties: false
