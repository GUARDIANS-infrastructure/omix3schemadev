$schema: http://json-schema.org/draft-04/schema#
id: medical_history
title: medical_history
type: object
namespace: https://omix3.test.biocommons.org.au/
category: clinical
program: '*'
project: '*'
description: 'Medical history of the participant

  '
submittable: true
validators: null
systemProperties:
- id
- project_id
- state
- created_datetime
- updated_datetime
uniqueKeys:
- - id
- - project_id
  - submitter_id
required:
- submitter_id
- type
links:
- name: sites
  backref: medical_historys
  label: part_of
  target_type: site
  multiplicity: one_to_one
  required: false
properties:
  $ref: _definitions.yaml#/ubiquitous_properties
  hypertension:
    description: Self-reported hypertension in the participant.
    enum:
    - 'Yes'
    - 'No'
  diabetes:
    description: Self-reported diabetes in the participant.
    enum:
    - 'Yes'
    - 'No'
  cancer:
    description: Self-reported cancer in the participant.
    enum:
    - 'Yes'
    - 'No'
  hay_fever:
    description: Self-reported hay fever or allergic rhinitis in the participant.
    enum:
    - 'Yes'
    - 'No'
  coeliac_disease:
    description: Self-reported coeliac disease in the participant.
    enum:
    - 'Yes'
    - 'No'
  depression:
    description: Self-reported depression in the participant.
    enum:
    - 'Yes'
    - 'No'
  mode_of_birth:
    description: How the participant was delivered at birth.
    enum:
    - Vaginal/Natural Birth
    - Caesarean section
    - Don't know
  infant_feeding:
    description: Primary feeding method during infancy.
    enum:
    - Primarily breastmilk
    - Primarily infant formula
    - A mixture of breastmilk and formula
    - Don't know
  sites:
    $ref: _definitions.yaml#/to_one
additionalProperties: false
